html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:800}
.eyebrow{font:600 15px/1.2 var(--body);color:var(--vc,var(--fg-2))}
.muted{color:var(--fg-2)}
.small{font-size:13.5px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;color:#fff;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;overflow:hidden;isolation:isolate}
.rail::before{content:"";position:absolute;inset:0;z-index:-2;background:#1a1410 var(--bgimg) 38% center/cover no-repeat}
.rail::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,12,18,.86) 0%,rgba(8,12,18,.78) 60%,rgba(8,12,18,.9) 100%)}
.rail .brand{margin-bottom:10px;display:flex;align-items:center;gap:10px}
.rail .logo{flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.rail .logo.ie{height:38px;width:auto}
.rail .logo.uni{height:40px;width:40px}
.rail .brand{flex-wrap:wrap;row-gap:6px}
.rail .brand h1{font-size:21px;color:#fff}
.rail .brand .eyebrow{color:rgba(255,255,255,.75);font-size:13.5px}
.rail nav{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:var(--radius);padding:8px 10px;color:rgba(255,255,255,.82);cursor:pointer;--vc:#fff}
.navbtn .sw{width:12px;height:12px;border-radius:3px;background:var(--vc);flex-shrink:0}
.navbtn:hover{background:rgba(255,255,255,.1)}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--vc)}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rail .foot .btn{width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.25;padding:8px 8px;font-size:13px}
.rail .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.rail .btn:hover{background:rgba(255,255,255,.2)}
.rail .savestate{color:rgba(255,255,255,.7)}
.savestate{font:500 13px var(--body);color:var(--fg-3);display:flex;align-items:center;gap:6px}
.savestate .dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.savestate.saving .dot{background:var(--warn)}
.savestate.saved .dot{background:var(--ok)}
.savestate.offline .dot{background:var(--danger)}

main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px;border-left:6px solid var(--vc);padding-left:14px}
.viewhead p{margin:0;max-width:70ch;color:var(--fg-2)}
.viewhead:empty{display:none}

/* hero banner: the road photo under a dark veil, with a two-line title (light, then bold) as in the title model */
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:170px;background:#2B241C var(--bgimg) center 40%/cover no-repeat;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,20,.78) 0%,rgba(10,14,20,.55) 45%,rgba(10,14,20,.25) 100%)}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--vc)}
.hero-in{position:relative;padding:26px 28px 24px 34px;color:#fff}
.hero-in .eyebrow{color:rgba(255,255,255,.85);font-size:16px}
.hero-title{display:flex;flex-direction:column;line-height:1.02;margin-top:8px;color:#fff;letter-spacing:-.015em}
.hero-title .light{font-weight:400;font-size:clamp(26px,3.6vw,44px);opacity:.92}
.hero-title .bold{font-weight:800;font-size:clamp(34px,5vw,64px)}
.hero-title .bold::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--vc);margin-top:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.top{border-top:5px solid var(--vc)}
.card.ch{border-left:6px solid var(--c)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid2>*{min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13.5px;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:13px;color:var(--fg-3)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;min-width:0}
select{appearance:auto;cursor:pointer}
textarea{resize:vertical;min-height:64px;line-height:1.45}
textarea.tall{min-height:120px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}

.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--radius);padding:6px 11px;cursor:pointer;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:13.5px}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm.ghost{min-height:28px;min-width:28px;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer;color:var(--fg-2);line-height:1.4}
.chip:hover{border-color:var(--fg-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.add{border-style:dashed;color:var(--fg-3);background:transparent}
.chip-in{display:inline-flex;gap:4px}
.chip-in input{width:160px;padding:3px 8px;font-size:12.5px;border-radius:999px}

.tag{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--body);padding:2px 8px;border-radius:999px;background:color-mix(in oklab,var(--c) 18%,var(--panel));color:color-mix(in oklab,var(--c) 75%,var(--fg));border:1px solid color-mix(in oklab,var(--c) 50%,var(--line))}
.pill{display:inline-block;font:500 12.5px var(--body);padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:0;background:transparent;padding:6px 10px;border-radius:var(--radius);cursor:pointer;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px}
.tab .sw{width:10px;height:10px;border-radius:2px;background:var(--c)}
.tab[aria-selected="true"]{background:color-mix(in oklab,var(--c) 18%,var(--panel));color:var(--fg);font-weight:600}

/* hypothesis */
.hyp-list{display:flex;flex-direction:column;gap:8px}
.hyp-item{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:start}
.hyp-item .code{font:700 14px var(--body);color:var(--accent);padding-top:9px}
.objlist{display:flex;flex-direction:column;gap:6px}
.objlist li{margin:0}
.objgroup{border-left:4px solid var(--c);padding:6px 12px;background:color-mix(in oklab,var(--c) 7%,var(--panel));border-radius:0 var(--radius) var(--radius) 0}
.objgroup ul{margin:4px 0 0;padding-left:18px}

/* chapters */
.ch-list{display:flex;flex-direction:column;gap:14px}
.ch-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer}
.ch-head .title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ch-head .title input{font-family:var(--display);font-weight:800;font-size:16px}
.ch-head .num{font:800 13px var(--body);color:var(--ink,#fff);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c);flex-shrink:0}
.ch-body{display:none;flex-direction:column;gap:14px}
.card.open .ch-body{display:flex}
.ch-summary{display:flex;flex-wrap:wrap;gap:6px;color:var(--fg-2);font-size:13.5px}
.sect{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.sect h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sect h3 .eyebrow{font-weight:500}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px}
.mgrid>*{min-width:0}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.boxes label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:3px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer}
.boxes input{margin:0}
.bullets{display:flex;flex-direction:column;gap:6px}
.bullet{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.bullet .dot{width:10px;height:10px;border-radius:50%;background:var(--c);justify-self:center}

/* dropdown component */
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:9px 12px;cursor:pointer;text-align:left;font-size:15px}
.dd-btn:hover{border-color:var(--accent)}
.dd-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-val.dd-empty{color:var(--fg-3)}
.dd-chev{color:var(--accent);font-size:14px;flex-shrink:0}
.dd-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow-y:auto;padding:6px}
.dd-panel.up{top:auto;bottom:calc(100% + 4px)}
.dd-opt{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dd-opt:hover{background:var(--panel-2)}
.dd-opt[aria-selected="true"]{background:var(--accent-soft)}
.dd-opt .dd-name{font-weight:600}
.dd-opt .dd-desc{font-size:13px;color:var(--fg-2);line-height:1.4}
.dtable .dd-btn{padding:6px 9px;font-size:13.5px}

/* method selects */
.msteps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mstep{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:10px 18px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(to right,color-mix(in oklab,var(--c) 6%,var(--panel)) 0,var(--panel) 260px)}
.mstep:last-child{border-bottom:0}
.mstep-head{display:flex;gap:10px;align-items:flex-start}
.mstep-n{font:800 13px var(--body);color:#fff;background:var(--c);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.mstep-title{font-weight:700;font-size:16px}
.mstep-src{font-size:13px;color:var(--fg-2);margin-top:3px}
.mstep-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.selrow>*{min-width:0}
.def{font-size:14px;color:var(--fg-2);padding:8px 10px;border-radius:var(--radius);background:var(--panel-2);border-left:3px solid var(--c)}
.def b{color:var(--fg)}
.def.empty{border-left-color:var(--line-2);color:var(--fg-3)}

/* matrix */
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;font-size:14px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.matrix th.param{width:200px;font-weight:600;color:var(--fg-2);background:var(--panel-2);position:sticky;left:0;z-index:1}
.matrix thead th{background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;border-bottom:0}
.matrix thead th.param{background:var(--panel-2);color:var(--fg-2)}
.matrix thead th:first-child{border-top-left-radius:var(--radius)}
.matrix thead th:last-child{border-top-right-radius:var(--radius)}
.matrix td{background:var(--panel)}
.matrix td.sec{font-size:13px;color:var(--fg-3)}
.matrix ul{margin:0;padding-left:16px}
.matrix .grp td,.matrix .grp th{background:color-mix(in oklab,var(--accent) 12%,var(--panel));font:800 14px var(--display);color:var(--fg);padding:7px 10px}
.matrix .grp th.param{background:color-mix(in oklab,var(--accent) 10%,var(--panel))}
.cell-empty{color:var(--line-2)}

/* outline */
.ol{display:flex;flex-direction:column;gap:6px}
.ol-item{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.ol-item.d1{margin-left:28px;background:var(--panel-2)}
.ol-item.d2{margin-left:56px;background:color-mix(in oklab,var(--c) 6%,var(--panel))}
.ol-item .num{font:700 13.5px var(--body);color:var(--c);padding-top:8px}
.ol-item .fields{display:flex;flex-direction:column;gap:5px;min-width:0}
.ol-item .acts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ol-item .acts .btn{padding:3px 6px}

/* data table */
.dtable{overflow-x:auto}
.dtable table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
.dtable th{font:600 13px var(--body);color:var(--fg-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.dtable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dtable input,.dtable select,.dtable textarea{padding:5px 7px;font-size:13.5px}
.dtable textarea{min-height:34px}
.st-obtida{color:var(--ok)} .st-tratada{color:var(--ok);font-weight:600} .st-extracao{color:var(--warn)} .st-obter{color:var(--danger)}

/* gantt: pill bars on soft tracks, grouped by article, today pill, progress fill, summary tiles and activity curves */
.gantt{overflow-x:auto;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:6px 0 10px}
.gt{position:relative;min-width:max-content;--wk:28px;--lbl:310px;--rowh:40px}
.gt-head{display:flex;position:sticky;top:0;z-index:3;background:var(--panel)}
.gt-head .lbl{width:var(--lbl);flex-shrink:0;position:sticky;left:0;background:var(--panel);z-index:4;padding:10px 16px 6px;font:600 13.5px var(--body);color:var(--fg-2);display:flex;align-items:flex-end}
.gt-months{display:flex;height:26px}
.gt-months div{font:600 13.5px var(--body);color:var(--fg-2);padding:6px 8px 0;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line)}
.gt-months div:nth-child(odd){background:color-mix(in oklab,var(--accent) 6%,transparent)}
.gt-weeks{display:flex;height:18px}
.gt-weeks div{width:var(--wk);font:400 10.5px var(--body);color:var(--fg-3);text-align:center;overflow:hidden}
.gt-row{display:flex;height:var(--rowh);position:relative}
.gt-row.grp{height:34px;margin-top:6px}
.gt-row .lbl{width:var(--lbl);flex-shrink:0;position:sticky;left:0;background:var(--panel);z-index:2;padding:0 16px;display:flex;align-items:center;gap:10px;font-size:14px;overflow:hidden;white-space:nowrap}
.gt-row.grp .lbl{font-family:var(--display);font-weight:800;color:var(--c);font-size:15px;border-left:4px solid var(--c);padding-left:12px}
.gt-row .lbl .pct{margin-left:auto;font:500 12.5px var(--body);color:var(--fg-3)}
.gt-row .track{position:relative;flex:1;background-image:linear-gradient(to right,color-mix(in oklab,var(--line) 55%,transparent) 1px,transparent 1px);background-size:var(--wk) 100%}
.gt-row:not(.grp) .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:12px;transform:translateY(-50%);border-radius:999px;background:var(--panel-2)}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:24px;border-radius:999px;background:color-mix(in oklab,var(--c) 38%,var(--panel));color:var(--fg);font-size:12.5px;font-weight:500;padding:0 10px 0 12px;display:flex;align-items:center;cursor:grab;user-select:none;touch-action:none;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c);width:var(--p,0%)}
.bar .txt{position:relative;z-index:1}
.bar.full .txt{color:var(--ink,#fff);text-shadow:none}
.bar .dotl{position:absolute;left:5px;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;transform:translateY(-50%);z-index:1;box-shadow:0 0 0 1.5px color-mix(in oklab,var(--c) 80%,#000)}
.bar.sel{box-shadow:0 0 0 2px var(--fg),0 1px 2px rgba(0,0,0,.08)}
.bar .rz{position:absolute;right:0;top:0;width:12px;height:100%;cursor:ew-resize;z-index:2}
.ms-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--v4);z-index:1;pointer-events:none;opacity:.75}
.ms-lbl{position:absolute;top:0;transform:translateX(-50%);font:600 12px var(--body);color:#fff;white-space:nowrap;background:var(--v4);padding:2px 8px;border-radius:999px;z-index:2}
.gt-row.grp .lbl{text-overflow:ellipsis}
.gt-row.grp .lbl .btn{flex-shrink:0}
.today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--danger);z-index:1;pointer-events:none}
.today-pill{position:absolute;top:2px;transform:translateX(-50%);font:600 12px var(--body);color:#fff;background:var(--danger);padding:2px 9px;border-radius:999px;z-index:3;white-space:nowrap}
.gt-ms{position:relative;height:46px;display:flex}
.gt-ms .lbl{align-self:stretch;display:flex;align-items:center;width:var(--lbl);flex-shrink:0;position:sticky;left:0;background:var(--panel);z-index:2;padding:0 16px;font-size:14px;color:var(--fg-2)}
.gt-ms .track{flex:1;position:relative}
.taskedit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-top:5px solid var(--tc,var(--accent))}
.tile .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--fg-2);margin-top:6px;font-weight:500}
.loadtbl{border-collapse:separate;border-spacing:3px;font-size:14px;min-width:100%}
.loadtbl th{text-align:left;padding:6px 8px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.loadtbl thead th{text-align:center;font-size:13px}
.loadtbl td{text-align:center;padding:6px 4px;border-radius:6px;min-width:44px;background:var(--panel-2)}
.loadtbl tr.tot td{background:var(--accent-soft);color:var(--fg)}
.dlist{display:flex;flex-direction:column;gap:12px}
.dcard{border:1px solid var(--line);border-left:6px solid var(--st);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.dgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
.dgrid>*{min-width:0}
@media (max-width:900px){ .dgrid{grid-template-columns:1fr 1fr} }

/* thesis sequence */
.seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;grid-auto-rows:auto}
.seqcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:grid;grid-template-rows:subgrid;grid-row:span 5}
.seqhead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--c);color:var(--ink,#fff);min-height:64px}
.seqhead .num{font:800 13px var(--body);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--ink,#fff) 25%,transparent);flex-shrink:0}
.seqhead .pill{background:color-mix(in oklab,var(--ink,#fff) 18%,transparent)!important;border-color:color-mix(in oklab,var(--ink,#fff) 40%,transparent)!important;color:var(--ink,#fff)!important}
.seqtitle{font-family:var(--display);font-weight:800;font-size:16px}
.seqobj{margin:0;padding:10px 14px 8px 30px;font-size:13.5px;color:var(--fg-2)}
.seqsec{padding:10px 14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.seqol{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.seqitem{display:flex;gap:8px;align-items:baseline}
.seqitem.d1{padding-left:14px;color:var(--fg-2)} .seqitem.d2{padding-left:28px;color:var(--fg-3);font-size:13px}
.seqnum{font-weight:700;color:var(--c);min-width:34px}
.seqdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;align-self:flex-start;margin-top:6px}
.seqsch{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.seqtask-row{display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap}
.seqtask-name{flex:1;min-width:0}
.seqtask-date{white-space:nowrap;flex-shrink:0}
.seqbar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.seqfill{height:100%;background:var(--c);border-radius:999px}


/* overview: FAPESP outline cards */
.rot{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.rotcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border-top:5px solid var(--line-2)}
.rotcard.ok{border-top-color:var(--ok)} .rotcard.part{border-top-color:var(--warn)} .rotcard.rot-empty{border-top-color:var(--danger)}
.rothead{display:flex;align-items:center;gap:8px}
.rotn{font:800 13px var(--body);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex-shrink:0}
.rottitle{font-weight:700;flex:1;min-width:0}
.rotcard.ok .rotst{color:var(--ok);border-color:var(--ok)} .rotcard.part .rotst{color:var(--warn);border-color:var(--warn)} .rotcard.rot-empty .rotst{color:var(--danger);border-color:var(--danger)}
.rotmiss{font-size:13px;color:var(--fg-2);flex:1}
.rotmiss.ok{color:var(--ok)}
.rotcard .btn{align-self:flex-start}
/* overview: sticky headers */
.seqcol{overflow:visible}
.seqhead{position:sticky;top:0;z-index:4;border-radius:10px 10px 0 0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.seqicon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:color-mix(in oklab,var(--ink,#fff) 18%,transparent);flex-shrink:0}
.seqhead .num{width:22px;height:22px;font-size:12px}
.mscroll{max-height:78vh;overflow:auto;border-radius:var(--radius)}
.matrix table{min-width:0}
.matrix thead th{position:sticky;top:0;z-index:3}
.matrix thead th.param{z-index:4;left:0}
.matrix th.param{z-index:2}
/* article icons */
.chicon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:color-mix(in oklab,var(--c) 12%,var(--panel));flex-shrink:0}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg-2);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--c);color:var(--c)}
.iconbtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ink,#fff)}
/* gantt: article timeline */
.gt-row.grp .lbl{gap:8px}
.gt-row.grp .lbl .glyph{display:inline-grid;place-items:center;color:var(--c);flex-shrink:0}
.gt-row.grp .lbl .gname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gt-row.grp .lbl .pct{margin-left:auto}
.gt-row.grp{height:38px}
.abar{position:absolute;top:50%;transform:translateY(-50%);height:16px;border-radius:999px;background:color-mix(in oklab,var(--c) 22%,var(--panel));border:1.5px solid var(--c);cursor:grab;user-select:none;touch-action:none;display:flex;align-items:center;padding:0 10px;overflow:hidden}
.abar .atxt{font:600 10.5px var(--body);color:var(--c);white-space:nowrap;letter-spacing:.02em}
.abar.sel{box-shadow:0 0 0 2px var(--fg)}
.abar .rz{position:absolute;right:0;top:0;width:12px;height:100%;cursor:ew-resize}
/* links map */
.lmap{position:relative}
.lsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lq{position:relative;z-index:1;padding:12px 14px;border-radius:10px;background:var(--accent-soft);margin-bottom:16px}
.lqtext{font-family:var(--display);font-weight:800;font-size:18px;margin-top:4px;text-wrap:balance}
.lcols{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:48px;position:relative;z-index:1}
.lcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.lcol>.eyebrow{margin-bottom:-4px}
.lcard{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);position:relative}
.lcard-title{font-weight:700}
.lcard-body{font-size:13.5px;color:var(--fg);margin-top:4px;line-height:1.45}
.lcard-foot{font-size:13px;color:var(--fg-2);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.lhyp{border:2px solid var(--accent);position:sticky;top:12px}
.lch{border-left:6px solid var(--c)}
.lch-head{display:flex;align-items:center;gap:10px}
.lch-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:var(--ink,#fff);flex-shrink:0}
.lobj{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--fg-2)}
.lsub{border-left:6px solid var(--line-2)}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (max-width:860px){ .lcols{grid-template-columns:1fr;gap:18px} .lsvg{display:none} .lhyp{position:static} }

/* milestones: numbered pins, period bands, key */
.ms-band{position:absolute;top:0;bottom:0;background:color-mix(in oklab,var(--mc) 13%,transparent);pointer-events:none}
.ms-pbar{position:absolute;top:27px;height:6px;border-radius:999px;background:var(--mc);opacity:.9}
.ms-num{position:absolute;top:20px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11.5px var(--body);background:var(--mc);color:var(--accent-ink);z-index:3;box-shadow:0 0 0 2px var(--panel);font-variant-numeric:tabular-nums}
.ms-num.static{position:static;transform:none;flex-shrink:0;box-shadow:none;align-self:center}
.ms-legend{display:flex;flex-wrap:wrap;gap:8px 20px;padding:0 4px;font-size:13.5px;color:var(--fg-2)}
.ms-key{display:flex;align-items:center;gap:8px}
.ms-kd{font-variant-numeric:tabular-nums;color:var(--fg-3)}
.ms-item{grid-template-columns:auto 140px 140px 1fr auto;align-items:center}
.loadtbl th.loadch{border-radius:6px;padding:6px 10px}
/* schedule rows: section tag and remove control */
.gt-row .lbl .tname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gt-row .lbl .tsec{color:var(--fg-3);font-size:12.5px}
.rowx{flex-shrink:0;border:1px solid transparent;background:transparent;color:var(--fg-3);font:500 15px var(--body);line-height:1;padding:3px 7px;border-radius:6px;cursor:pointer}
.rowx:hover,.rowx:focus-visible{color:var(--danger);border-color:var(--line);outline:none}
.rowx.armed{color:var(--accent-ink);background:var(--danger);border-color:var(--danger);font-size:12px;padding:4px 8px}
/* references */
.reflist{display:flex;flex-direction:column;gap:10px}
.refcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--v9);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.refcard:not(.open){cursor:pointer}
.refcard:not(.open):hover{border-color:var(--line-2)}
.refhead{display:grid;grid-template-columns:auto minmax(240px,1fr) auto;gap:12px;align-items:center}
.refmain{min-width:0}
.refchips{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;max-width:460px}

/* links da tese */
.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lkcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--vc);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lkcard.editing{gap:10px;border-top-color:var(--warn)}
.lktitle{font-weight:700;font-size:15.5px;line-height:1.3}
.lkdesc{color:var(--fg-2);font-size:13.5px;line-height:1.45;flex:1}
.lkfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px}
.lkdom{font-size:12.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.reftitle{font-weight:600;font-size:15.5px;line-height:1.3}
.refbody{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pill.code{font-family:var(--mono);font-weight:600;background:color-mix(in oklab,var(--v9) 14%,var(--panel));border-color:color-mix(in oklab,var(--v9) 50%,var(--line));color:color-mix(in oklab,var(--v9) 75%,var(--fg))}
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel-2)}
.qtext{margin:8px 0 0;padding:6px 12px;border-left:4px solid var(--v9);font-style:italic;color:var(--fg);white-space:pre-wrap}
@media (max-width:760px){ .refhead{grid-template-columns:1fr} }
.curves{overflow-x:auto}
.curves svg{display:block}
.curves text{font-family:var(--body);font-size:12.5px;fill:var(--fg-2)}
.range{display:flex;flex-direction:column;gap:4px}
.range input[type=range]{width:100%}
.ms-list{display:flex;flex-direction:column;gap:6px}
.ms-item{display:grid;grid-template-columns:150px 1fr auto;gap:8px}

/* links map */
.map{overflow-x:auto}
.map svg{display:block;min-width:720px;width:100%;height:auto;font-family:var(--body)}
.map .box{fill:var(--panel);stroke:var(--line-2)}
.map text{fill:var(--fg);font-size:12px}
.map .lbl{fill:var(--fg-2);font:600 12px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2px solid var(--fg-3)}
.legend i.dash{border-top-style:dashed}

/* econ */
.sample{display:flex;flex-wrap:wrap;gap:6px}
.sample .st{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 6px 3px 10px;font-size:13.5px}
.sample .st select{width:auto;padding:1px 4px;font-size:11.5px;border-radius:999px}
.sample .st.done{border-color:var(--ok)}

.refs{font-size:13.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:4px}
.refs li{margin:0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:var(--shadow)}
.modal textarea{flex:1;min-height:50vh;font-family:var(--mono);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:22px;text-align:center;color:var(--fg-2)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail nav{flex-direction:row;flex-wrap:wrap}
  .rail .foot{margin-top:4px;flex-direction:row;align-items:center;justify-content:space-between}
  .hyp-item,.ol-item{grid-template-columns:44px 1fr}
  .hyp-item>:last-child,.ol-item>:last-child{grid-column:2}
  .ol-item.d1{margin-left:14px} .ol-item.d2{margin-left:28px}
  .ms-item{grid-template-columns:1fr}
  .mstep{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.navbtn{transition:background .12s,border-color .12s} }

/* ---------- modo leitura: a mesma página sem edição ---------- */
.reader .hint,.reader .rowx,.reader .bar .rz,.reader .abar .rz{display:none!important}
.reader .bar,.reader .abar{cursor:default}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.rgrid .wide{grid-column:1/-1}
@media (max-width:900px){ .rgrid{grid-template-columns:1fr} }
.rfield{display:flex;flex-direction:column;gap:4px;min-width:0}
.rlabel{font-size:13.5px;font-weight:600;color:var(--fg-2)}
.rval{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.chips.ro .chip{cursor:default}
.hyp-item.ro{grid-template-columns:44px 1fr}
.hyp-item.ro .code{padding-top:2px}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th,.rtable td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.rtable th{font-weight:600;color:var(--fg-2);font-size:13px;white-space:nowrap}
.rtable tr:last-child td{border-bottom:0}
.rtable td.k{font-weight:600;white-space:nowrap;color:var(--fg-2)}
.rsum{display:flex;flex-direction:column;gap:4px}
.rsum .it{display:flex;gap:10px;align-items:baseline}
.rsum .it.d1{padding-left:22px} .rsum .it.d2{padding-left:44px;font-size:14px;color:var(--fg-2)}
.rsum .n{font-weight:700;color:var(--c);min-width:34px}
.rsum .pv{color:var(--fg-3);font-size:13px}
.rchs{display:flex;flex-direction:column;gap:14px}
.rch-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rch-head h2{font-size:19px}
.rmeta{font-size:12.5px;color:var(--fg-3);text-align:center;line-height:1.4;padding:4px 2px}
/* capa da versão publicada (vídeo com áreas clicáveis sobre os blocos) */
.cover-wrap{background:#16224f;padding:0 0 6px}
.cover{position:relative;max-width:1280px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;background:#16224f center/cover no-repeat}
.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.cover video.on{opacity:1}
.hot{position:absolute;border-radius:1.2cqw;text-decoration:none;outline:none;transition:box-shadow .3s,background-color .3s,transform .3s;display:block}
.hot .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.hot:hover{box-shadow:0 0 0 2px rgba(255,255,255,.8);background-color:rgba(255,255,255,.07)}
.hot:active{transform:scale(.97)}
.hot:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(255,255,255,.35)}
.hot[aria-current="true"]{box-shadow:0 0 0 3px #fff,0 14px 34px rgba(0,0,0,.45)}
.cover.picked .hot:not([aria-current="true"]){background-color:rgba(10,14,30,.28)}
.cover.picked .hot:not([aria-current="true"]):hover{background-color:rgba(255,255,255,.07)}
.pp{position:absolute;right:10px;top:10px;border:0;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;background:rgba(10,14,30,.45);color:#fff;cursor:pointer;opacity:.75}
.pp:hover,.pp:focus-visible{opacity:1;outline:2px solid #fff;outline-offset:2px}
.pp svg{width:14px;height:14px;fill:currentColor}
.static .rail .foot .btn.cm{display:none}
.static .hero{min-height:118px}
.static .hero-in{padding:18px 24px 18px 30px}
.static .hero-title .light{font-size:clamp(20px,2.4vw,28px)}
.static .hero-title .bold{font-size:clamp(26px,3.4vw,40px)}
.static .hero-title .bold::after{margin-top:8px;height:4px}
</style>
</head>

<script id="tese-data" type="application/json">{"thesis":{"title":"Financing Channels and the Quality of Infrastructure Investment: Evidence from Brazil","question":"Como os canais de financiamento importam para a provisão de infraestrutura no Brasil?","hypothesis":"A entrega da infraestrutura varia conforme o canal de financiamento, porque cada canal impõe um regime de governança próprio, cujo efeito depende da esfera de governo que o opera.","objective":"Analisar como os canais de financiamento condicionam a provisão de infraestrutura no Brasil, identificando o regime de governança que cada canal impõe, segundo a esfera de governo que o opera, e estimando os efeitos desses regimes sobre a entrega das obras.","justification":"","resumo":"","icloud":"/Users/arthurcassemiro/Library/Mobile Documents/com~apple~CloudDocs/5. Acadêmico/5.2 Doutorado/5.2.4 Tese/Bibliografia","subs":[{"id":"ylvt4x1","text":"Obras rodoviárias equivalentes financiadas por canais diferentes têm entrega diferente: prazo, execução financeira e custo variam com o canal."},{"id":"3cl4i8l","text":"A diferença vem do regime de governança que cada canal impõe ao longo do caminho do recurso: quanto mais exigente o regime, melhor a entrega."},{"id":"mqkqzir","text":"A estrutura federativa condiciona o efeito: o mesmo canal opera com regras diferentes na União e nos estados, e o efeito do canal varia entre as esferas."},{"id":"vf7w7tu","text":"As diferenças de entrega mudam o retorno do investimento: o multiplicador efetivo varia por canal, e os arranjos novos só alteram esse retorno quando mudam o regime de governança."}]},"options":{"bases":["SICONFI (STN)","FINBRA (STN)","SIGA Brasil (Senado) / SIAFI","Tesouro Transparente: operações de crédito e garantias (STN)","COFIEX (MPO)","Transferegov / Portal da Transparência","ObrasGov.br","Novo PAC / PAC","CIPI (Cadastro Integrado de Projetos de Investimento)","DNIT (SNV, contratos e obras)","ANTT (concessões rodoviárias)","Sistemas estaduais de execução or 596}\n}","category":"Working paper","chapters":[],"code":"Orair2019","doi":"","link":"http://repositorio.ipea.gov.br/handle/11058/9596","notes":"Importado de BibliografiaTese.bib (JabRef) em 27/10/2026.","pdfStatus":"Sem PDF","title":"Reforma tributária e federalismo fiscal: uma análise das propostas de criação de um novo imposto sobre o valor adicionado para o Brasil","venue":"Ipea, Texto para Discussão","year":"2019"},"rRamey2020":{"id":"rRamey2020","abstract":"Ramey compara os efeitos de curto e longo prazo do investimento público num modelo neoclássico estilizado e num modelo novo-keynesiano de escala média. Os atrasos de implementação típicos de infraestrutura derrubam o multiplicador de curto prazo; no longo prazo, ele é alto quando o capital público é produtivo. Na parte empírica, mostra que efeitos de equilíbrio geral viesam para cima a elasticidade do produto ao capital público e reestima os efeitos do ARRA.\n\nNotas (páginas do capítulo de 2021): com seis trimestres de atraso o multiplicador do primeiro ano cai para perto de zero (tabela 4.2, p. 231; p. 236); só 11% das dotações rodoviárias do ARRA gastas até jun. 2009 (p. 235). Multiplicadores de longo prazo 1,3 a 1,8 com θG = 0,05 e 2,2 a 2,8 com θG = 0,10 (tabela 4.3, p. 239). Razão ótima investimento/PIB 2,5% a 5% (p. 240). Monte Carlo: θG estimado 0,64 quando o verdadeiro é 0,05 (p. 251); elasticidade plausível 0,065 a 0,12 (pp. 261-262). Crowding-in de US$ 2,30 por dólar federal no ARRA (Leduc e Wilson, 2017, p. 255). Tags: infraestrutura, investimento público, multiplicadores fiscais, capital público, crowding-out, ARRA, EUA.","added":"2026-10-12","areas":["Macro teórica","Infraestrutura"],"authors":"Ramey, Valerie A.","bibtex":"@techreport{Ramey2020,\n  author      = {Ramey, Valerie A.},\n  title       = {The Macroeconomic Consequences of Infrastructure Investment},\n  institution = {National Bureau of Economic Research},\n  address     = {Cambridge, MA},\n  type        = {NBER Working Paper},\n  n (function(){

/* ---------- classic methodological taxonomy (source cited on each parameter) ---------- */
const REFS=[
  'GIL, A. C. Métodos e técnicas de pesquisa social. 6. ed. São Paulo: Atlas, 2008.',
  'GIL, A. C. Como elaborar projetos de pesquisa. 6. ed. São Paulo: Atlas, 2017.',
  'MARCONI, M. A.; LAKATOS, E. M. Fundamentos de metodologia científica. 5. ed. São Paulo: Atlas, 2003.',
  'PRODANOV, C. C.; FREITAS, E. C. Metodologia do trabalho científico: métodos e técnicas da pesquisa e do trabalho acadêmico. 2. ed. Novo Hamburgo: Feevale, 2013.'
];
const METHOD=[
 {key:'natureza',title:'Natureza da Pesquisa',src:'Gil (2008); Prodanov e Freitas (2013)',multi:false,opts:[
  ['Básica','Gera conhecimentos novos, úteis para o avanço da ciência, sem aplicação prática prevista; envolve verdades e interesses universais.'],
  ['Aplicada','Gera conhecimentos para aplicação prática, dirigidos à solução de problemas específicos; envolve verdades e interesses locais.']]},
 {key:'objetivos',title:'Objetivos da Pesquisa',src:'Gil (2008, 2017)',multi:false,opts:[
  ['Exploratória','Proporciona maior familiaridade com o problema, para torná-lo explícito ou construir hipóteses; envolve levantamento bibliográfico, entrevistas e análise de exemplos.'],
  ['Descritiva','Descreve as características de determinada população ou fenômeno, ou estabelece relações entre variáveis; usa técnicas padronizadas de coleta de dados.'],
  ['Explicativa','Identifica os fatores que determinam ou contribuem para a ocorrência dos fenômenos; explica a razão e o porquê das coisas e é o tipo que mais aprofunda o conhecimento da realidade.']]},
 {key:'abordagem',title:'Abordagem do Problema',src:'Prodanov e Freitas (2013)',multi:false,opts:[
  ['Quantitativa','Considera que tudo pode ser quantificável: traduz em números opiniões e informações para classificá-las e analisá-las; requer recursos e técnicas estatísticas.'],
  ['Qualitativa','Considera a relação dinâmica entre o mundo real e o sujeito; a interpretação dos fenômenos e a atribuição de significados são básicas, sem exigir métodos estatísticos.'],
  ['Quali-quantitativa','Combina as duas abordagens no mesmo estudo, em sequência ou em paralelo, com a parte qualitativa informando a quantitativa ou vice-versa.']]},
 {key:'metodo_abordagem',title:'Método de Abordagem',src:'Marconi e Lakatos (2003)',multi:false,opts:[
  ['Dedutivo','Parte de premissas gerais (teorias e leis) para chegar a conclusões particulares; se as premissas são verdadeiras, a conclusão também o é.'],
  ['Indutivo','Parte de dados particulares, suficientemente constatados, para uma verdade geral não contida nas partes examinadas; a conclusão é provável.'],
  ['Hipotético-dedutivo','Parte de um problema, formula hipóteses (conjecturas) e as submete a testes de falseamento pela observação e pela experimentação (Popper).'],
  ['Dialético','Penetra o mundo dos fenômenos pela sua ação recíproca, pela contradição inerente ao fenômeno e pela mudança dialética que ocorre na natureza e na sociedade.'],
  ['Fenomenológico','Descreve o fenômeno tal como se apresenta à consciência, sem reduzi-lo a causas; a realidade é construída socialmente.']]},
 {key:'metodo_procedimento',title:'Método de Procedimento',src:'Marconi e Lakatos (2003)',multi:true,opts:[
  ['Histórico','Investiga acontecimentos, processos e instituições do passado para verificar sua influência na sociedade de hoje.'],
  ['Comparativo','Estuda semelhanças e diferenças entre diversos tipos de grupos, sociedades ou fenômenos, no presente ou no passado.'],
  ['Monográfico (estudo de caso)','Estuda em profundidade um caso (indivíduo, grupo, instituição, programa) considerado representativo de muitos outros.'],
  ['Estatístico','Reduz fenômenos sociológicos, políticos e econômicos a termos quantitativos e usa a manipulação estatística para verificar relações entre eles.'],
  ['Tipológico','Constrói tipos ideais (modelos) para comparar com a realidade e verificar o que dela se aproxima ou se afasta.'],
  ['Funcionalista','Estuda a sociedade do ponto de vista da função de suas unidades, isto é, como sistema de partes interdependentes.'],
  ['Estruturalista','Parte do fenômeno concreto, eleva-se ao nível abstrato (modelo que representa a estrutura) e retorna ao concreto como realidade estruturada.']]},
 {key:'procedimento_tecnico',title:'Procedimentos Técnicos (Delineamento)',src:'Gil (2008, 2017)',multi:true,opts:[

const pending=new Map();

async function flush(){
  const docs=[...pending.keys()]; pending.clear();
  if(!db){ setSave('offline','Sem conexão: edições ficam só nesta aba'); return; }
  try{
    for(const d of docs){
      const body=d==='thesis/main'?S.thesis:d==='thesis/options'?S.options:d==='schedule/main'?S.schedule:d==='econ/main'?S.econ:d.startsWith('refs/')?S.refs[d.slice(5)]:d.startsWith('quotes/')?S.quotes[d.slice(7)]:d.startsWith('links/')?S.links[d.slice(6)]:S.chapters[d.slice(9)];
      if(body) await db.doc(d).set(JSON.parse(JSON.stringify(body))); else await db.doc(d).delete();
    }
    setSave('saved','Salvo');
  }catch(e){ setSave('offline','Não foi possível salvar. Tente de novo'); console.error(e); }
}

function applySnapshot(d){
  const cp=x=>JSON.parse(JSON.stringify(x||{}));
  Object.assign(S.thesis,cp(d.thesis)); const od=cp(d.options); for(const k in DEFAULT_OPTIONS){ if(Array.isArray(od[k])) S.options[k]=od[k].slice(); }
  Object.assign(S.schedule,cp(d.schedule)); Object.assign(S.econ,cp(d.econ));
  for(const id in (d.chapters||{})) S.chapters[id]=Object.assign({id},cp(d.chapters[id]));
  for(const id in (d.refs||{})) S.refs[id]=Object.assign({id},cp(d.refs[id]));
  for(const id in (d.quotes||{})) S.quotes[id]=Object.assign({id},cp(d.quotes[id]));
  for(const id in (d.links||{})) S.links[id]=Object.assign({id},cp(d.links[id]));
  EXPORTED=d.exported||''; normalize();
}
async function load(){
  if(STATIC){ try{ applySnapshot(JSON.parse(document.getElementById('tese-data').textContent)); }catch(e){ console.error(e); } render(); return; }
  try{ db=await claude.use('db'); dl=await claude.use('downloads'); sampleFn=await claude.use('sample'); }catch(e){ db=null; }
  if(!db){ setSave('offline','Sem conexão: edições ficam só nesta aba'); render(); return; }
  try{
    const [t,o,sc,ec,chs,rf,qt,lk]=await Promise.all([db.doc('thesis/main').get(),db.doc('thesis/options').get(),db.doc('schedule/main').get(),db.doc('econ/main').get(),db.collection('chapters').get(),db.collection('refs').get(),db.collection('quotes').get(),db.collection('links').get()]);
    /* snapshots are frozen: deep-copy everything before the page edits it */
    const cp=x=>JSON.parse(JSON.stringify(x));
    if(t.exists) Object.assign(S.thesis,cp(t.data()));
    if(o.exists){ const od=cp(o.data()); for(const k in DEFAULT_OPTIONS){ if(Array.isArray(od[k])) S.options[k]=od[k].slice(); } }
    if(sc.exists) Object.assign(S.schedule,cp(sc.data()));
    if(ec.exists) Object.assign(S.econ,cp(ec.data()));
    chs.docs.forEach(d=>{ S.chapters[d.id]=Object.assign({id:d.id},cp(d.data())); });
    rf.docs.forEach(d=>{ S.refs[d.id]=Object.assign({id:d.id},cp(d.data())); });
    qt.docs.forEach(d=>{ S.quotes[d.id]=Object.assign({id:d.id},cp(d.data())); });
    lk.docs.forEach(d=>{ S.links[d.id]=Object.assign({id:d.id},cp(d.data())); });
    normalize();
    setSave('saved','Salvo');
  }catch(e){ setSave('offline','Não foi possível carregar os dados'); console.error(e); }
  render();
}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k];
    if(k==='class') el.className=v; else if(k==='style') el.style.cssText=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else if(k==='html') el.innerHTML=v; else if(v!==false&&v!=null) el.setAttribute(k,v===true?'':v); }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}

/* ---------- export ---------- */
function toMarkdown(){
  const T=S.thesis,chs=chList(),subs=T.subs||[],L=[]; const H=i=>'H'+(subs.findIndex(s=>s.id===i)+1); const list=a=>(a&&a.length)?a.join('; '):'—';
  const art=(c,i)=>`Artigo ${i+1}. ${c.title||c.short}`;
  const mline=(c,k)=>{ const mp=METHOD.find(x=>x.key===k); const v=mval(c,k); return `- ${mp.title}: ${v.p||'—'}${v.s?' (secundário: '+v.s+')':''} [${mp.src}]`; };
  L.push('# '+(T.title||'Projeto de tese'),'','_Estrutura conforme o roteiro FAPESP para projetos de pesquisa de bolsa._','');
  L.push('## 1. Resumo','',T.resumo||'[Até 20 linhas: problema, método e resultado esperado.]','');
  L.push('## 2. Introdução e justificativa','','**Pergunta de pesquisa.** '+(T.question||'—'),'','**Hipótese geral.** '+(T.hypothesis||'—'),'');
  subs.forEach((s,i)=>L.push(`- **H${i+1}.** ${s.text}`)); if(subs.length) L.push('');
  L.push('**Justificativa.** '+(T.justification||'—'),'');
  L.push('## 3. Objetivos','','**Objetivo geral.** '+(T.objective||'—'),'','**Objetivos específicos**','');
  chs.forEach((c,i)=>(c.objectives||[]).filter(x=>x.trim()).forEach(o=>L.push(`- (Art. ${i+1}) ${o}`))); L.push('');
  chs.forEach((c,i)=>{ L.push(`**${art(c,i)}.** Pergunta: ${c.question||'—'} Hipóteses defendidas: ${(c.subs||[]).map(H).join(', ')||'—'}. Como sustenta a hipótese: ${c.defends||'—'}`,''); });
  const SC=S.schedule; L.push('## 4. Plano de trabalho e cronograma','',`Início: ${fmtD(SC.start)} · ${SC.weeks} semanas`,'');
  chs.forEach((c,i)=>{ if(c.tl_start&&c.tl_end) L.push(`- **${art(c,i)}:** ${fmtD(c.tl_start)} a ${fmtD(c.tl_end)}`); }); L.push('','| Artigo | Etapa | Início | Fim |','|---|---|---|---|');
  (SC.tasks||[]).slice().sort((a,b)=>a.start-b.start).forEach(t=>{ const c=S.chapters[t.ch]; L.push(`| ${c?c.short:'—'} | ${t.etapa} | ${fmtD(addDays(SC.start,t.start*7))} | ${fmtD(addDays(SC.start,t.end*7+6))} |`); });
  L.push('','**Marcos**',''); (SC.milestones||[]).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(ms=>L.push(`- ${fmtD(ms.date)}: ${ms.label}`)); L.push('');
  chs.forEach((c,i)=>{ if((c.outline||[]).length){ L.push(`**Sumário proposto: ${art(c,i)}**`,''); const walk=(items,prefix,ind)=>items.forEach((s,j)=>{ const num=prefix?prefix+'.'+(j+1):String(j+1); L.push(`${'   '.repeat(ind)}${num}. ${s.title}${s.proves?' — '+s.proves:''}`); walk(s.children||[],num,ind+1); }); walk(c.outline,'',0); L.push(''); } });
  L.push('## 5. Material e métodos','');
  chs.forEach((c,i)=>{ L.push(`### ${art(c,i)}`,'');
    ['natureza','objetivos','abordagem','metodo_abordagem','metodo_procedimento','procedimento_tecnico','coleta'].forEach(k=>L.push(mline(c,k)));
    L.push(`- Recorte temporal: ${c.recorte_t||'—'}`,`- Esferas de governo: ${(c.esferas||[]).join(', ')||'—'}`,`- Abrangência espacial: ${[c.abrangencia,c.recorte_e].filter(Boolean).join(' · ')||'—'}`,'');
    if((c.data||[]).length){ L.push('**Dados utilizados**','','| Fonte | Conteúdo | Período | Unidade | Extração | Status |','|---|---|---|---|---|---|'); c.data.forEach(d=>L.push(`| ${d.fonte||''}${(d.esferas||[]).length?' ('+d.esferas.join(', ')+')':''} | ${(d.variaveis||[]).join('; ')}${d.conteudo?' · '+d.conteudo.replace(/\n/g,' '):''} | ${d.periodo||''} | ${d.unidade||''} | ${d.extracao||''} | ${d.status||''} |`)); L.push(''); }
    if(c.notes) L.push('**Notas de estrutura**','',c.notes,''); });
  L.push('## 6. Forma de análise dos resultados','');
  chs.forEach((c,i)=>L.push(`- **${art(c,i)}.** ${mline(c,'tratamento').slice(2)}`)); L.push('');
  const E=S.econ;
  L.push('**Modelo econométrico**','',`- Pergunta empírica: ${E.question||'—'}`,`- Equação: ${E.equacao||'—'}`,`- Dependentes: ${list(E.dependentes)}`,`- Independentes: ${list(E.independentes)}`,`- Controles e dummies: ${list(E.controles)}`,`- Unidade de análise: ${E.unidade||'—'}`,`- Período: ${E.periodo||'—'}`,`- Amostra: ${(E.sample||[]).map(s=>`${s.uf} (${s.status})`).join(', ')||'—'}`,`- Identificação: ${list(E.identificacao)}`,`- Tratamento: ${E.tratamento||'—'}`,`- Ameaças à identificação: ${E.ameacas||'—'}`,`- Robustez: ${list(E.robustez)}`,`- Fontes: ${list(E.fontes)}`,'');
  if(E.estrutura) L.push(E.estrutura,'');
  const rs=refList(); if(rs.length){ L.push('## 7. Referências e citações','','**Referências**',''); rs.forEach(r=>L.push(`- [${r.code}] ${r.authors||'—'} (${r.year||'s.d.'}). ${r.title||'—'}. ${r.venue||''}${r.doi?' DOI: '+r.doi:''}${(r.chapters||[]).length?' · artigos: '+(r.chapters||[]).map(id=>S.chapters[id]?S.chapters[id].short:'').filter(Boolean).join(', '):''}`)); L.push('');
    const qs=quoteList(); if(qs.length){ L.push('**Citações guardadas**',''); qs.forEach(q=>{ const r=S.refs[q.ref]; if(r) L.push(`> ${q.text}\n> — ${refLabel(r)}${q.page?', '+q.page:''} [${r.code}]${q.ch&&S.chapters[q.ch]?' · '+S.chapters[q.ch].short:''}${q.where?' · '+q.where:''}`,''); }); }
    L.push('```bibtex',rs.map(r=>r.bibtex).filter(Boolean).join('\n\n'),'```',''); }
  L.push('## Referências da classificação metodológica',''); REFS.forEach(r=>L.push('- '+r));
  const lks=linkList(); if(lks.length){ L.push('','## Links da tese',''); lks.forEach(l=>L.push(`- ${l.group?'['+l.group+'] ':''}${l.title}: ${l.url}${l.desc?' · '+l.desc:''}`)); }
  return L.join('\n');
}
function exportMarkdown(){
  const md=toMarkdown(); const ta=h('textarea',{readonly:true}); ta.value=md;
  const modal=h('div',{class:'modal'},h('div',{class:'box'},h('div',{class:'row between'},h('h2',null,'Projeto de Pesquisa em Markdown'),h('div',{class:'row'},
    h('button',{class:'btn',onclick:()=>{ navigator.clipboard.writeText(md).then(()=>toast('Copiado'),()=>{ta.focus();ta.select();toast('Selecione e copie o texto');}); }},'Copiar'),
    dl?h('button',{class:'btn',onclick:()=>{ dl.save({filename:'projeto-tese.md',data:md}).then(()=>toast('Arquivo salvo'),()=>toast('Download não concluído')); }},'Salvar .md'):null,
    h('button',{class:'btn primary',onclick:()=>modal.remove()},'Fechar'))),ta));
  document.body.append(modal);
}

function renderCover(){
  if(!STATIC||document.getElementById('cover')) return;
  const cover=h('div',{class:'cover',id:'cover'}); cover.style.backgroundImage='url('+COVER_POSTER+')';
  const vid=h('video',{id:'capa',muted:'',loop:'',playsinline:'',autoplay:'',preload:'auto','aria-hidden':'true'}); vid.muted=true; cover.append(vid);
  COVER_HOTS.forEach(([k,l,t,w,hh])=>{ const vw=VIEWS.find(x=>x[0]===k); if(!vw) return; cover.append(h('a',{class:'hot',href:'#'+k,'data-view':k,style:`left:${l}%;top:${t}%;width:${w}%;height:${hh}%`,title:vw[1],onclick:e=>{ e.preventDefault(); cover.classList.add('picked'); go(k); }},h('span',{class:'sr'},vw[1]))); });
  const PAUSE='<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>',PLAY='<svg viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z"/></svg>';
  const pp=h('button',{class:'pp',id:'pp','aria-label':'Pausar o vídeo da capa'}); pp.innerHTML=PAUSE;
  pp.addEventListener('click',()=>{ if(vid.paused){ vid.play().catch(()=>{}); pp.innerHTML=PAUSE; pp.setAttribute('aria-label','Pausar o vídeo da capa'); } else { vid.pause(); pp.innerHTML=PLAY; pp.setAttribute('aria-label','Reproduzir o vídeo da capa'); } });
  cover.append(pp);
  const src=window.TESE_VIDEO_URL||'capa.mp4'; vid.src=src;
  vid.addEventListener('loadeddata',()=>{ vid.classList.add('on'); vid.play().catch(()=>{ pp.innerHTML=PLAY; }); });
  vid.addEventListener('error',()=>{ pp.hidden=true; });
  const wrap=h('header',{class:'cover-wrap'},cover); document.body.insertBefore(wrap,document.querySelector('.app'));
}
function syncCover(){ const c=document.getElementById('cover'); if(!c) return; c.querySelectorAll('.hot').forEach(a=>{ if(a.dataset.view===view) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); }); }
function buildStatic(){
  const snap={thesis:S.thesis,options:S.options,chapters:S.chapters,schedule:S.schedule,econ:S.econ,refs:S.refs,quotes:S.quotes,links:S.links,exported:todayISO()};
  const style=(document.getElementById('app-style')||{}).textContent||'';
  const script=(document.getElementById('app-script')||{}).textContent||'';
  const app=document.querySelector('.app').cloneNode(true); app.querySelector('#nav').innerHTML=''; app.querySelector('#view').innerHTML=''; const ft=app.querySelector('.foot'); if(ft) ft.innerHTML='';
  const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const json=JSON.stringify(snap).replace(/<\//g,'<\\/');
  const fonts='https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap';
  return ['<!doctype html>','<html lang="pt-BR">','<head>','<meta charset="utf-8">','<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">','<meta name="robots" content="noindex,nofollow">','<title>'+esc(S.thesis.title||'Projeto da Tese')+'</title>','<link rel="stylesheet" href="'+fonts+'">','<style id="app-style">'+style+'</style>','</head>','<body>',app.outerHTML,'<script id="tese-data" type="application/json">'+json+'</'+'script>','<script>window.TESE_VIDEO_URL="capa.mp4";</'+'script>','<script id="app-script">'+script+'</'+'script>','</body>','</html>'].join('\n');
}
function exportStatic(){
  const html=buildStatic(); const kb=Math.round(html.length/1024);
  const steps=h('ol',{style:'margin:8px 0 0;padding-left:20px;line-height:1.5'},
    h('li',null,'Baixe o arquivo index.html (',kb,' KB). Ele já traz os dados de hoje, em modo leitura; para atualizar, exporte de novo e substitua.'),
    h('li',null,'Coloque na pasta do repositório, ao lado do vídeo da capa salvo como capa.mp4 (ou mude o nome em TESE_VIDEO_URL no fim do arquivo).'),
    h('li',null,'Faça o commit e publique no GitHub Pages; o endereço fica como o do Plano Londres.'));
  const modal=h('div',{class:'modal'},h('div',{class:'box'},h('div',{class:'row between'},h('h2',null,'Exportar para o GitHub'),h('div',{class:'row'},
    dl?h('button',{class:'btn primary',onclick:()=>{ dl.save({filename:'index.html',data:html}).then(()=>toast('index.html salvo'),()=>toast('Download não concluído')); }},'Baixar index.html'):null,
    h('button',{class:'btn',onclick:()=>{ navigator.clipboard.writeText(html).then(()=>toast('HTML copiado'),()=>toast('Não foi possível copiar')); }},'Copiar HTML'),
    h('button',{class:'btn',onclick:()=>modal.remove()},'Fechar'))),
    h('p',{class:'small muted',style:'margin:10px 0 0'},'A página publicada é esta mesma, sem edição: os formulários somem, os campos viram texto, o Quadro Geral fica mais curto e a capa em vídeo leva às seis áreas principais.'),steps));
  document.body.append(modal);
}

/* ---------- boot ---------- */
STATIC=!window.claude&&!!document.getElementById('tese-data');
if(STATIC){ R=true; } else { try{ R=localStorage.getItem('tese-reader')==='1'; }catch(e){ R=false; } }
document.body.classList.toggle('reader',R); document.body.classList.toggle('static',STATIC);
if(STATIC) renderCover();
const hash=(location.hash||'').slice(1); if(VIEWS.some(([k])=>k===hash)) view=hash;
window.addEventListener('hashchange',()=>{ const k=(location.hash||'').slice(1); if(k&&k!==view&&VIEWS.some(([x])=>x===k)){ view=k; render(); } });
render(); load();
})();
